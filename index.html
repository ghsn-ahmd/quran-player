<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>القرآن الكريم — مشغل صوتي</title>
<meta name="theme-color" content="#0B6E4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="مشغّل صوتي للقرآن الكريم والأذكار يعمل من ملفاتك على جهازك">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="القرآن">

<!-- Favicon: هلال -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%230B6E4F'/%3E%3Cstop offset='100%25' stop-color='%23D4AF37'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M40 18a14 14 0 1 0 0 28 16 16 0 1 1 0-28z' fill='%23FFF8E1'/%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ═══ Splash ═══ -->
<div class="splash" id="splash">
  <svg viewBox="0 0 120 120" fill="none">
    <defs>
      <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0B6E4F"/>
        <stop offset="50%" stop-color="#7FB77E"/>
        <stop offset="100%" stop-color="#D4AF37"/>
      </linearGradient>
    </defs>
    <circle cx="60" cy="60" r="52" fill="url(#sg)" opacity="0.15"/>
    <path d="M74 30 a32 32 0 1 0 0 60 a26 26 0 1 1 0-60 z" fill="url(#sg)"/>
    <circle cx="84" cy="42" r="4" fill="#F4D03F"/>
  </svg>
  <h1>بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</h1>
  <p>مشغل القرآن الكريم</p>
</div>

<!-- ═══ Header ═══ -->
<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M16 4 A9 9 0 1 0 16 20 A7 7 0 1 1 16 4 Z" fill="currentColor"/>
          <circle cx="19" cy="8" r="1.3" fill="currentColor"/>
        </svg>
      </div>
      <h1>القرآن الكريم</h1>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="pickBtn" title="اختيار مجلد" aria-label="اختيار مجلد">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          <path d="M12 11v6"/><path d="M9 14h6"/>
        </svg>
      </button>
      <button class="icon-btn" id="viewBtn" title="طريقة العرض" aria-label="طريقة العرض">
        <svg id="viewIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="الوضع الليلي" aria-label="الوضع الليلي">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<!-- ═══ Tabs ═══ -->
<div class="tabs hidden" id="tabs">
  <div class="t-tabs" role="tablist" id="tTabs">
    <span class="t-tabs-pill" id="tPill" aria-hidden="true"></span>
    <button class="t-tab" role="tab" aria-selected="true" data-tab="quran" id="tabQuran">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      القرآن <span class="count" id="qCount">0</span>
    </button>
    <button class="t-tab" role="tab" aria-selected="false" data-tab="athkar" id="tabAthkar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>
      </svg>
      أذكار <span class="count" id="aCount">0</span>
    </button>
    <button class="t-tab" role="tab" aria-selected="false" data-tab="favs" id="tabFavs">
      ★ مفضلة <span class="count" id="fCount">0</span>
    </button>
  </div>
</div>

<!-- ═══ Toolbar ═══ -->
<div class="toolbar hidden" id="toolbar">
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="search" id="search" placeholder="ابحث..." autocomplete="off" aria-label="بحث">
    <button class="clear-btn" id="clearBtn" aria-label="مسح">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
</div>

<!-- ═══ Content ═══ -->
<main class="content">
  <div class="empty" id="empty">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M16 4 A9 9 0 1 0 16 20 A7 7 0 1 1 16 4 Z" fill="currentColor"/>
      </svg>
    </div>
    <h2>لم يتم اختيار مجلد بعد</h2>
    <p>اختر مجلد التلاوات الصوتية من جهازك. سيتم حفظ الملفات لفتحات قادمة.</p>
    <button class="btn-primary" id="pickBtn2">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        <path d="M12 11v6"/><path d="M9 14h6"/>
      </svg>
      اختر مجلد الصوتيات
    </button>
  </div>
  <button class="resume hidden" id="resumeBtn"><span>▶ تابع الاستماع</span><b id="resumeName"></b><small id="resumeTime"></small></button>
  <button class="resume perm hidden" id="permBtn">🔓 اضغط للسماح بقراءة المجلد وتحديث المكتبة</button>
  <div class="import hidden" id="imp" role="status"><div class="imp-top"><span id="impName">…</span><b id="impCount"></b></div><div class="imp-track"><i id="impFill"></i></div></div>


  <div class="grid hidden" id="grid"></div>

  <div class="empty hidden" id="noResults">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
    </div>
    <h2 id="nrTitle">لا توجد نتائج</h2>
    <p id="nrText">جرّب كلمات بحث أخرى.</p>
  </div>

  <div class="grid hidden" id="skel">
    <div class="skel"><div class="skel-c"></div><div class="skel-l"></div><div class="skel-l short"></div></div>
    <div class="skel"><div class="skel-c"></div><div class="skel-l"></div><div class="skel-l short"></div></div>
    <div class="skel"><div class="skel-c"></div><div class="skel-l"></div><div class="skel-l short"></div></div>
    <div class="skel"><div class="skel-c"></div><div class="skel-l"></div><div class="skel-l short"></div></div>
  </div>
</main>

<!-- ═══ Full Player ═══ -->
<div class="player" id="player" role="dialog" aria-label="مشغل الصوت">
  <div class="player-header">
    <button class="ph-btn" id="minimizeBtn" aria-label="تصغير">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m6 9 6 6 6-6"/>
      </svg>
    </button>
    <div class="ph-title" id="phTitle">قيد التشغيل</div>
    <button class="ph-btn" id="closeBtn" aria-label="إغلاق">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="player-stage">
    <!-- الفينيل -->
    <div class="vinyl-wrap">
      <div class="vinyl-glow"></div>
      <div class="vinyl" id="vinyl">
        <div class="vinyl-label">
          <!-- هلال -->
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M16 4 A9 9 0 1 0 16 20 A7 7 0 1 1 16 4 Z"/>
            <circle cx="18.5" cy="7.5" r="1.2" fill="#F4D03F"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- المعلومات -->
    <div class="player-info">
      <div class="player-num" id="pNum">—</div>
      <div class="player-title" id="pTitle">—</div>
    </div>

    <!-- شريط التقدم -->
    <div class="progress-wrap">
      <div class="progress" id="progress" role="slider" aria-label="التقدم" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-row">
        <span id="tCurrent">0:00</span>
        <span id="tTotal">0:00</span>
      </div>
    </div>
  </div>

  <!-- ═══ منطقة التحكم الكاملة ═══ -->
  <div class="controls-area">
    <!-- 1) صف الصوت (فوق) -->
    <div class="volume-row">
      <button class="vol-btn" id="muteBtn" aria-label="كتم">
        <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H2v6h4l5 4z"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
      </button>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100" aria-label="مستوى الصوت">
    </div>

    <!-- 2) أزرار التحكم الرئيسية (تحت الصوت) -->
    <div class="controls-main">
      <button class="ctrl" id="shuffleBtn" aria-label="عشوائي">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/>
        </svg>
      </button>
      <button class="ctrl" id="prevBtn" aria-label="السابق">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="ctrl play" id="playBtn" aria-label="تشغيل">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl" id="nextBtn" aria-label="التالي">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
      <button class="ctrl" id="repeatBtn" aria-label="تكرار">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/>
          <path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>
        </svg>
      </button>
    </div>
    <div class="p-extra">
      <button class="chip" id="speedBtn" aria-label="سرعة التشغيل">1×</button>
      <button class="chip" id="sleepBtn" aria-label="مؤقت النوم">⏾ مؤقت</button>
      <button class="chip" id="favBtn" aria-label="المفضلة">☆ مفضلة</button>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>
</div>

<!-- ═══ Mini Player ═══ -->
<div class="mini" id="mini" role="button" tabindex="0" aria-label="فتح المشغل">
  <div class="mini-inner">
    <div class="mini-vinyl" id="miniVinyl"></div>
    <div class="mini-info">
      <div class="mini-title" id="miniTitle">—</div>
      <div class="mini-progress">
        <div class="mini-progress-fill" id="miniFill"></div>
      </div>
    </div>
    <div class="mini-controls">
      <button class="mini-btn" id="miniPrev" aria-label="السابق">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="mini-btn play" id="miniPlay" aria-label="تشغيل">
        <svg id="miniPlayIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="mini-btn" id="miniNext" aria-label="التالي">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
      <button class="mini-btn" id="miniClose" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
